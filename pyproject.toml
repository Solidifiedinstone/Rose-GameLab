[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rose-gamelab"
version = "0.1.0"
description = "Game collection manager — import emulators, ROMs, and launcher games from everywhere, play from one place"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.7.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "pysdl2>=0.9.0",
    "pysdl2-dll>=2.28.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[project.scripts]
rose-gamelab = "rose_gamelab.main:main"

[tool.setuptools.packages.find]
include = ["rose_gamelab*"]

[tool.ruff]
target-version = "py312"
line-length = 120
