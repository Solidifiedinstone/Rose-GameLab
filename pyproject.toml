[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rose-gamelab"
version = "0.1.0"
description = "Game collection manager — import emulators, ROMs, and launcher games from everywhere, play from one place"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.7.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[project.scripts]
rose-gamelab = "rose_gamelab.main:main"

[tool.setuptools.packages.find]
include = ["rose_gamelab*"]

# The controller database is data, not code, and setuptools ships no data file
# it is not told about. Without this the wheel installs with no
# gamecontrollerdb.txt and every pad silently falls back to its family layout —
# working, but not what was promised, and invisible until someone plugs in a
# SNES adapter.
[tool.setuptools.package-data]
rose_gamelab = ["data/*.txt", "data/*.LICENSE"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Deliberately not the full default set. These catch real mistakes —
# undefined names, unused imports, shadowed builtins, import order — without
# enforcing stylistic rewrites that would churn the codebase for no benefit.
select = ["E", "F", "I", "B", "SIM", "PIE", "RUF"]
ignore = [
    "E501",     # line length is handled by the formatter, not the linter
    "B008",     # function calls in defaults are used deliberately for Qt
    "SIM105",   # contextlib.suppress is not clearer than try/except here
    "RUF012",   # mutable class attrs are fine for Qt widget definitions
    "SIM108",   # a ternary is not clearer than if/else for these branches
    "RUF001",   # fullwidth glyphs are used deliberately as UI icons
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately import things only to assert they exist, and use
# fixtures that look unused to a linter.
"tests/*" = ["F401", "F811", "B011"]
